<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Dispatch AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/">Dispatch<span>AI</span></a>
    <nav>
      <a href="/">Home</a>
      <a href="/onboard">New client</a>
    </nav>
  </header>

  <section style="padding: 40px 0;">
    <h1 style="font-size:28px;">Clients</h1>
    <p style="color:#4b5563;">Every business that's filled out the intake form, with their AI agent's draft script.</p>
    <div class="client-list" id="clientList"></div>
  </section>

  <footer>Dispatch AI — MVP prototype.</footer>
</div>

<script>
// Used when embedding a client's own company name inside an HTML attribute
// (the widget embed snippet) so quotes/special characters in their name
// can't break the generated code.
function escapeAttr(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

async function loadClients() {
  const res = await fetch('/api/clients');
  const clients = await res.json();
  const list = document.getElementById('clientList');
  list.innerHTML = '';

  if (clients.length === 0) {
    list.innerHTML = '<p style="color:#9ca3af;">No clients yet. <a href="/onboard">Add one</a>.</p>';
    return;
  }

  clients.slice().reverse().forEach((client) => {
    const card = document.createElement('div');
    card.className = 'client-card';

    const statusClass = client.status === 'paid' ? 'status-paid'
      : client.status === 'cancelled' ? 'status-cancelled'
      : client.status === 'approved' ? 'status-approved'
      : client.status === 'generating' ? 'status-generating'
      : 'status-draft';

    // The script itself was already reviewed once the client has ever
    // reached approved/paid/cancelled -- cancellation is a billing state,
    // not a reason to re-review the script.
    const scriptWasApproved = ['approved', 'paid', 'cancelled'].includes(client.status);

    const paymentLinkButtons = `
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-secondary checkout-btn" data-id="${client.id}" data-plan="starter">Get Starter link</button>
        <button class="btn btn-secondary checkout-btn" data-id="${client.id}" data-plan="growth">Get Growth link</button>
      </div>
      <div class="checkout-result" data-id="${client.id}" style="margin-top:10px; display:none;"></div>
    `;

    let billingHtml = '';
    if (client.status === 'paid') {
      const planLabel = client.plan === 'growth' ? 'Growth' : client.plan === 'starter' ? 'Starter' : 'plan unknown';
      const companyName = client.intake?.companyName || '';
      const widgetSnippet = `<script src="${window.location.origin}/widget.js" data-client-id="${client.id}" data-company-name="${escapeAttr(companyName)}" data-label="Chat with us"><` + `/script>`;

      let phoneHtml;
      if (!client.retellAgentId) {
        phoneHtml = `
          <div style="font-size:12px; color:#1e40af; margin-bottom:8px;">Push this client's approved script to Retell AI so it can answer real phone calls, not just website chat.</div>
          <button class="btn btn-secondary create-phone-agent-btn" data-id="${client.id}">Create phone agent</button>
          <div class="phone-agent-result" data-id="${client.id}" style="margin-top:10px; display:none;"></div>
        `;
      } else {
        const numberLine = client.retellPhoneNumber
          ? `<div style="font-size:13px; font-weight:600; margin-bottom:6px;">📞 Live number: ${escapeAttr(client.retellPhoneNumber)}</div>`
          : `<div style="font-size:12px; color:#1e40af; margin-bottom:8px;">Phone agent created. Now, inside Retell's own dashboard (no code needed): go to Phone Numbers → buy or import a number → assign its inbound agent to the ID below. Call it yourself to test before giving it to the client.</div>`;
        phoneHtml = `
          ${numberLine}
          <div style="font-size:11.5px; color:#1e40af; margin-bottom:8px;">Retell agent ID: <code style="font-size:11px;">${client.retellAgentId}</code></div>
          <input type="text" class="phone-number-input" data-id="${client.id}" value="${escapeAttr(client.retellPhoneNumber || '')}" placeholder="Paste the number here once it's assigned in Retell" style="width:100%; padding:8px; border-radius:6px; border:1px solid #bfdbfe; font-size:12.5px; margin-bottom:8px;" />
          <button class="btn btn-secondary save-phone-number-btn" data-id="${client.id}">${client.retellPhoneNumber ? 'Update number' : 'Save number'}</button>
          <div class="phone-number-result" data-id="${client.id}" style="margin-top:8px; display:none;"></div>
        `;
      }

      billingHtml = `
        <div class="billing-box billing-paid">
          <div>💳 Paid — ${planLabel}</div>
          <div style="margin-top:12px;">
            <button class="btn btn-secondary portal-btn" data-id="${client.id}">Get manage-subscription link</button>
          </div>
          <div class="portal-result" data-id="${client.id}" style="margin-top:10px; display:none;"></div>
          <div style="margin-top:16px; padding-top:14px; border-top:1px solid #bfdbfe;">
            <div style="font-size:12.5px; font-weight:600; margin-bottom:6px;">Website chat widget code</div>
            <div style="font-size:12px; color:#1e40af; margin-bottom:8px;">Send this to the client to paste into their own website (just before <code>&lt;/body&gt;</code>). It only works while they're on the Paid plan.</div>
            <textarea readonly style="width:100%; padding:8px; border-radius:6px; border:1px solid #bfdbfe; font-size:11.5px; font-family:ui-monospace, monospace; min-height:60px;" onclick="this.select()">${widgetSnippet}</textarea>
            <div style="margin-top:8px;"><a href="/widget-guide.html" target="_blank" style="font-size:12px; color:#1e40af; font-weight:600;">Step-by-step install guide for WordPress, Wix, Squarespace &amp; more →</a></div>
          </div>
          <div style="margin-top:16px; padding-top:14px; border-top:1px solid #bfdbfe;">
            <div style="font-size:12.5px; font-weight:600; margin-bottom:6px;">Website chat conversations</div>
            <div style="font-size:12px; color:#1e40af; margin-bottom:8px;">Every conversation their widget has had with a real visitor, and whether it turned into a booking.</div>
            <button class="btn btn-secondary conversations-btn" data-id="${client.id}">View conversations</button>
            <div class="conversations-box" data-id="${client.id}" style="margin-top:10px; display:none;"></div>
          </div>
          <div style="margin-top:16px; padding-top:14px; border-top:1px solid #bfdbfe;">
            <div style="font-size:12.5px; font-weight:600; margin-bottom:6px;">Live phone agent</div>
            ${phoneHtml}
          </div>
          <div style="margin-top:16px; padding-top:14px; border-top:1px solid #bfdbfe;">
            <div style="font-size:12.5px; font-weight:600; margin-bottom:6px;">Past customers &amp; repeat-work outreach</div>
            <div style="font-size:12px; color:#1e40af; margin-bottom:8px;">Send this client their own private link -- they upload their past customer list there, and review/approve/send reminders themselves once someone's due for their next service.</div>
            <button class="btn btn-secondary get-customer-link-btn" data-id="${client.id}">Get customer upload link</button>
            <div class="customer-link-result" data-id="${client.id}" style="margin-top:10px; display:none;"></div>
            <button class="btn btn-secondary view-past-customers-btn" data-id="${client.id}" style="margin-top:8px;">View past-customer outreach</button>
            <div class="past-customers-box" data-id="${client.id}" style="margin-top:10px; display:none;"></div>
          </div>
        </div>
      `;
    } else if (client.status === 'cancelled') {
      const retellReminder = client.retellAgentId
        ? `<div style="font-size:12.5px; margin-bottom:10px;">Retell agent ID <code style="font-size:11px;">${client.retellAgentId}</code>${client.retellPhoneNumber ? ` (number: ${escapeAttr(client.retellPhoneNumber)})` : ''} — pause or remove it in Retell's own dashboard so the number stops answering as this client.</div>`
        : `<div style="font-size:12.5px; margin-bottom:10px;">This client's AI agent should be considered off until they resubscribe. If they're connected to a real phone number, pause or remove that agent in Retell too.</div>`;
      billingHtml = `
        <div class="billing-box billing-cancelled">
          <div style="font-weight:600; margin-bottom:8px;">⚠️ Subscription cancelled${client.cancelledAt ? ' — ' + new Date(client.cancelledAt).toLocaleDateString() : ''}</div>
          ${retellReminder}
          ${paymentLinkButtons}
        </div>
      `;
    } else if (client.status === 'approved') {
      if (client.reviewMode === 'auto' && client.customerEmailSentAt) {
        billingHtml = `
          <div class="billing-box">
            <div style="font-size:13px; font-weight:600; margin-bottom:6px;">🤖 Auto-approved -- passed the automatic safety check</div>
            <div style="font-size:12.5px; color:#4b5563; margin-bottom:10px;">Payment link emailed to ${client.intake?.contactEmail || 'the customer'} on ${new Date(client.customerEmailSentAt).toLocaleString()}. No action needed unless you want to send it again.</div>
            ${paymentLinkButtons}
          </div>
        `;
      } else if (client.reviewMode === 'auto') {
        billingHtml = `
          <div class="billing-box">
            <div style="font-size:13px; font-weight:600; margin-bottom:6px;">🤖 Auto-approved, but no payment link could be emailed automatically</div>
            <div style="font-size:12.5px; color:#4b5563; margin-bottom:10px;">This script passed the automatic safety check, but Stripe or Resend isn't fully configured yet, so nothing was sent. Send a link manually below once that's set up.</div>
            ${paymentLinkButtons}
          </div>
        `;
      } else {
        billingHtml = `
          <div class="billing-box">
            <div style="font-size:13px; font-weight:600; margin-bottom:8px;">Send a payment link to go live</div>
            ${paymentLinkButtons}
          </div>
        `;
      }
    }

    // Shown whenever there's a leftover reviewReason, regardless of the
    // client's exact status -- covers both the normal case (still in
    // "draft", never auto-approved) and a rarer edge case (already
    // auto-approved, but something failed afterwards, like the
    // confirmation email not sending) where it still deserves a look.
    const reviewBanner = client.reviewReason
      ? `<div style="margin-top:10px; padding:12px 14px; background:#fef3c7; border:1px solid #fde68a; border-radius:10px; font-size:13px; color:#78350f;">
          <strong>⚠️ Needs your review:</strong> ${client.reviewReason}
        </div>`
      : '';

    card.innerHTML = `
      <div class="top-row">
        <strong>${client.intake?.companyName || '(unnamed)'}</strong>
        <span class="status-pill ${statusClass}">${client.status}</span>
      </div>
      <div style="font-size:13px; color:#6b7280; margin-top:4px;">
        ${client.intake?.trades || ''} · ${client.intake?.serviceArea || ''}${client.intake?.contactEmail ? ' · ' + client.intake.contactEmail : ''}
      </div>
      ${reviewBanner}
      <textarea class="script-box" data-id="${client.id}">${client.script || ''}</textarea>
      <div style="margin-top:10px; display:flex; gap:10px;">
        <button class="btn btn-secondary save-btn" data-id="${client.id}">Save edits</button>
        <button class="btn btn-primary approve-btn" data-id="${client.id}" ${scriptWasApproved ? 'disabled' : ''}>
          ${scriptWasApproved ? 'Approved ✓' : 'Approve script'}
        </button>
      </div>
      ${billingHtml}
    `;
    list.appendChild(card);
  });

  document.querySelectorAll('.save-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const textarea = document.querySelector(`.script-box[data-id="${id}"]`);
      btn.textContent = 'Saving...';
      await fetch(`/api/clients/${id}/script`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ script: textarea.value })
      });
      btn.textContent = 'Save edits';
    });
  });

  document.querySelectorAll('.approve-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      await fetch(`/api/clients/${id}/approve`, { method: 'POST' });
      loadClients();
    });
  });

  document.querySelectorAll('.checkout-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const plan = btn.dataset.plan;
      const resultBox = document.querySelector(`.checkout-result[data-id="${id}"]`);
      resultBox.style.display = 'block';
      resultBox.textContent = 'Generating link...';

      try {
        const res = await fetch(`/api/clients/${id}/checkout`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ plan })
        });
        const data = await res.json();

        if (data.demoMode) {
          resultBox.innerHTML = `<span style="color:#9a3412;">${data.message}</span>`;
        } else if (data.url) {
          resultBox.innerHTML = `
            <div style="font-size:12.5px; margin-bottom:4px;">Send this link to the client to complete payment:</div>
            <input type="text" readonly value="${data.url}" style="width:100%; padding:8px; border-radius:6px; border:1px solid #e5e7eb; font-size:12.5px;" onclick="this.select()" />
          `;
        } else {
          resultBox.innerHTML = `<span style="color:#b91c1c;">Something went wrong generating the link.</span>`;
        }
      } catch (err) {
        resultBox.innerHTML = `<span style="color:#b91c1c;">Something went wrong generating the link.</span>`;
      }
    });
  });

  const OUTCOME_LABELS = {
    booked: '✅ Booked',
    unbooked_lead: '🟠 Unbooked lead',
    resolved_question: '💬 Question answered',
    unclear: '⏳ Not reviewed yet',
    unclassified: '⏳ Not reviewed yet',
  };

  document.querySelectorAll('.conversations-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const box = document.querySelector(`.conversations-box[data-id="${id}"]`);

      if (box.style.display === 'block') {
        box.style.display = 'none';
        return;
      }

      box.style.display = 'block';
      box.innerHTML = '<div style="font-size:12.5px; color:#6b7280;">Loading conversations...</div>';

      try {
        const res = await fetch(`/api/clients/${id}/conversations`);
        const conversations = await res.json();

        if (!Array.isArray(conversations) || conversations.length === 0) {
          box.innerHTML = '<div style="font-size:12.5px; color:#9ca3af;">No website chat conversations yet.</div>';
          return;
        }

        box.innerHTML = conversations.map((c) => {
          const outcomeLabel = OUTCOME_LABELS[c.outcome] || c.outcome;
          const contactBits = [c.contactName, c.contactEmail, c.contactPhone].filter(Boolean).map(escapeAttr).join(' · ');
          const transcript = (c.messages || [])
            .map((m) => `${m.role === 'user' ? 'Visitor' : 'AI'}: ${m.content}`)
            .join('\n');

          let followUpHtml = '';
          if (c.outcome === 'unbooked_lead') {
            if (!c.contactEmail) {
              followUpHtml = `<div style="margin-top:8px; font-size:12px; color:#9ca3af;">No email captured, so a follow-up can't be drafted for this visitor.</div>`;
            } else if (c.followUpStatus === 'none') {
              followUpHtml = `<div style="margin-top:8px; font-size:12px; color:#9ca3af;">Drafting a follow-up message... check back in a moment.</div>`;
            } else {
              const isApproved = c.followUpStatus === 'approved';
              const isSent = c.followUpStatus === 'sent';
              const statusLabel = isSent
                ? `(Sent ✓ ${c.followUpSentAt ? new Date(c.followUpSentAt).toLocaleString() : ''})`
                : isApproved
                ? '(Approved ✓ -- ready to send)'
                : '(review before using it)';
              followUpHtml = `
                <div style="margin-top:10px; padding-top:10px; border-top:1px dashed #e5e7eb;">
                  <div style="font-size:12px; font-weight:600; color:#374151; margin-bottom:6px;">
                    Follow-up draft ${statusLabel}
                  </div>
                  <input type="text" class="followup-subject" data-convo-id="${c.id}" data-client-id="${c.clientId}" value="${escapeAttr(c.followUpSubject || '')}" placeholder="Subject" ${isSent ? 'disabled' : ''} style="width:100%; padding:6px 8px; border-radius:6px; border:1px solid #e5e7eb; font-size:12.5px; margin-bottom:6px;" />
                  <textarea class="followup-body" data-convo-id="${c.id}" data-client-id="${c.clientId}" ${isSent ? 'disabled' : ''} style="width:100%; padding:6px 8px; border-radius:6px; border:1px solid #e5e7eb; font-size:12.5px; min-height:70px;">${escapeAttr(c.followUpBody || '')}</textarea>
                  <div style="margin-top:6px; display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="btn btn-secondary save-followup-btn" data-convo-id="${c.id}" data-client-id="${c.clientId}" ${isSent ? 'disabled' : ''}>Save edits</button>
                    <button class="btn btn-primary approve-followup-btn" data-convo-id="${c.id}" data-client-id="${c.clientId}" ${isApproved || isSent ? 'disabled' : ''}>${isApproved || isSent ? 'Approved ✓' : 'Approve draft'}</button>
                    ${!isSent ? `<button class="btn btn-primary send-followup-btn" data-convo-id="${c.id}" data-client-id="${c.clientId}" ${isApproved ? '' : 'disabled'}>Send now</button>` : `<button class="btn btn-secondary" disabled>Sent ✓</button>`}
                  </div>
                  <div class="send-result" data-convo-id="${c.id}" style="margin-top:6px; font-size:12px;"></div>
                </div>
              `;
            }
          }

          return `
            <div style="border:1px solid #e5e7eb; border-radius:10px; padding:10px; margin-bottom:8px; background:#fff;">
              <div style="display:flex; justify-content:space-between; gap:10px; font-size:12px; color:#6b7280;">
                <span>${new Date(c.updatedAt).toLocaleString()}</span>
                <span>${outcomeLabel}</span>
              </div>
              ${contactBits ? `<div style="font-size:12.5px; margin-top:4px;">${contactBits}</div>` : ''}
              ${c.summary ? `<div style="font-size:12.5px; color:#374151; margin-top:4px;">${escapeAttr(c.summary)}</div>` : ''}
              <details style="margin-top:6px;">
                <summary style="font-size:12px; color:#146856; cursor:pointer;">View full chat</summary>
                <pre style="white-space:pre-wrap; font-size:11.5px; background:#f6f7f9; border-radius:6px; padding:8px; margin-top:6px;">${escapeAttr(transcript)}</pre>
              </details>
              ${followUpHtml}
            </div>
          `;
        }).join('');

        box.querySelectorAll('.save-followup-btn').forEach((followBtn) => {
          followBtn.addEventListener('click', async () => {
            const convoId = followBtn.dataset.convoId;
            const cId = followBtn.dataset.clientId;
            const subjectInput = box.querySelector(`.followup-subject[data-convo-id="${convoId}"]`);
            const bodyInput = box.querySelector(`.followup-body[data-convo-id="${convoId}"]`);
            followBtn.textContent = 'Saving...';
            await fetch(`/api/clients/${cId}/conversations/${convoId}/follow-up`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ subject: subjectInput.value, body: bodyInput.value })
            });
            followBtn.textContent = 'Save edits';
          });
        });

        box.querySelectorAll('.approve-followup-btn').forEach((approveBtn) => {
          approveBtn.addEventListener('click', async () => {
            const convoId = approveBtn.dataset.convoId;
            const cId = approveBtn.dataset.clientId;
            await fetch(`/api/clients/${cId}/conversations/${convoId}/follow-up/approve`, { method: 'POST' });
            approveBtn.textContent = 'Approved ✓';
            approveBtn.disabled = true;
            const sendBtn = box.querySelector(`.send-followup-btn[data-convo-id="${convoId}"]`);
            if (sendBtn) sendBtn.disabled = false;
          });
        });

        box.querySelectorAll('.send-followup-btn').forEach((sendBtn) => {
          sendBtn.addEventListener('click', async () => {
            const convoId = sendBtn.dataset.convoId;
            const cId = sendBtn.dataset.clientId;
            const resultBox = box.querySelector(`.send-result[data-convo-id="${convoId}"]`);
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';

            try {
              const res = await fetch(`/api/clients/${cId}/conversations/${convoId}/follow-up/send`, { method: 'POST' });
              const data = await res.json();

              if (data.demoMode) {
                if (resultBox) resultBox.innerHTML = `<span style="color:#9a3412;">${data.message}</span>`;
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send now';
              } else if (data.error) {
                if (resultBox) resultBox.innerHTML = `<span style="color:#b91c1c;">${data.error}</span>`;
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send now';
              } else {
                sendBtn.textContent = 'Sent ✓';
                if (resultBox) resultBox.innerHTML = `<span style="color:#166534;">Sent!</span>`;
              }
            } catch (err) {
              if (resultBox) resultBox.innerHTML = `<span style="color:#b91c1c;">Something went wrong sending the email.</span>`;
              sendBtn.disabled = false;
              sendBtn.textContent = 'Send now';
            }
          });
        });
      } catch (err) {
        box.innerHTML = '<div style="font-size:12.5px; color:#b91c1c;">Something went wrong loading conversations.</div>';
      }
    });
  });

  document.querySelectorAll('.portal-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const resultBox = document.querySelector(`.portal-result[data-id="${id}"]`);
      resultBox.style.display = 'block';
      resultBox.textContent = 'Generating link...';

      try {
        const res = await fetch(`/api/clients/${id}/portal`, { method: 'POST' });
        const data = await res.json();

        if (data.demoMode) {
          resultBox.innerHTML = `<span style="color:#9a3412;">${data.message}</span>`;
        } else if (data.url) {
          resultBox.innerHTML = `
            <div style="font-size:12.5px; margin-bottom:4px;">Send this link to the client so they can manage or cancel their subscription (this link expires after a while, so send it promptly):</div>
            <input type="text" readonly value="${data.url}" style="width:100%; padding:8px; border-radius:6px; border:1px solid #e5e7eb; font-size:12.5px;" onclick="this.select()" />
          `;
        } else {
          resultBox.innerHTML = `<span style="color:#b91c1c;">Something went wrong generating the link.</span>`;
        }
      } catch (err) {
        resultBox.innerHTML = `<span style="color:#b91c1c;">Something went wrong generating the link.</span>`;
      }
    });
  });

  document.querySelectorAll('.create-phone-agent-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const resultBox = document.querySelector(`.phone-agent-result[data-id="${id}"]`);
      resultBox.style.display = 'block';
      resultBox.textContent = 'Creating phone agent... this calls Retell AI, may take a few seconds.';
      btn.disabled = true;

      try {
        const res = await fetch(`/api/clients/${id}/create-phone-agent`, { method: 'POST' });
        const data = await res.json();

        if (data.demoMode) {
          resultBox.innerHTML = `<span style="color:#9a3412;">${data.message}</span>`;
          btn.disabled = false;
        } else if (data.agentId) {
          loadClients();
        } else {
          resultBox.innerHTML = `<span style="color:#b91c1c;">${data.error || 'Something went wrong creating the phone agent.'}</span>`;
          btn.disabled = false;
        }
      } catch (err) {
        resultBox.innerHTML = `<span style="color:#b91c1c;">Something went wrong creating the phone agent.</span>`;
        btn.disabled = false;
      }
    });
  });

  document.querySelectorAll('.save-phone-number-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const input = document.querySelector(`.phone-number-input[data-id="${id}"]`);
      const resultBox = document.querySelector(`.phone-number-result[data-id="${id}"]`);
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        await fetch(`/api/clients/${id}/phone-number`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ phoneNumber: input.value.trim() })
        });
        loadClients();
      } catch (err) {
        resultBox.style.display = 'block';
        resultBox.innerHTML = `<span style="color:#b91c1c;">Something went wrong saving the number.</span>`;
        btn.disabled = false;
        btn.textContent = 'Save number';
      }
    });
  });

  const OUTREACH_STATUS_LABELS = {
    none: '⏳ Not due yet',
    no_email: '⚠️ No email on file',
    drafted: '📝 Client is reviewing a draft',
    approved: '✅ Approved by client, not sent yet',
    sent: '✔️ Sent',
  };

  document.querySelectorAll('.get-customer-link-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const resultBox = document.querySelector(`.customer-link-result[data-id="${id}"]`);
      resultBox.style.display = 'block';
      resultBox.textContent = 'Generating link...';

      try {
        const res = await fetch(`/api/clients/${id}/customer-portal-link`, { method: 'POST' });
        const data = await res.json();
        if (data.url) {
          resultBox.innerHTML = `
            <div style="font-size:12.5px; margin-bottom:4px;">Send this link to the client:</div>
            <input type="text" readonly value="${data.url}" style="width:100%; padding:8px; border-radius:6px; border:1px solid #bfdbfe; font-size:12.5px;" onclick="this.select()" />
          `;
        } else {
          resultBox.innerHTML = `<span style="color:#b91c1c;">Something went wrong generating the link.</span>`;
        }
      } catch (err) {
        resultBox.innerHTML = `<span style="color:#b91c1c;">Something went wrong generating the link.</span>`;
      }
    });
  });

  document.querySelectorAll('.view-past-customers-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const box = document.querySelector(`.past-customers-box[data-id="${id}"]`);

      if (box.style.display === 'block') {
        box.style.display = 'none';
        return;
      }

      box.style.display = 'block';
      box.innerHTML = '<div style="font-size:12.5px; color:#6b7280;">Loading...</div>';

      try {
        const res = await fetch(`/api/clients/${id}/past-customers`);
        const pastCustomers = await res.json();

        if (!Array.isArray(pastCustomers) || pastCustomers.length === 0) {
          box.innerHTML = '<div style="font-size:12.5px; color:#9ca3af;">This client hasn\'t uploaded any past customers yet.</div>';
          return;
        }

        box.innerHTML = pastCustomers.map((c) => {
          const statusLabel = OUTREACH_STATUS_LABELS[c.outreachStatus] || c.outreachStatus;
          const meta = [c.serviceType, c.lastServiceDate, c.email].filter(Boolean).map(escapeAttr).join(' · ');
          return `
            <div style="border:1px solid #e5e7eb; border-radius:10px; padding:10px; margin-bottom:8px; background:#fff;">
              <div style="display:flex; justify-content:space-between; gap:10px; font-size:12.5px;">
                <strong>${escapeAttr(c.name || '(unnamed)')}</strong>
                <span style="color:#6b7280;">${statusLabel}</span>
              </div>
              ${meta ? `<div style="font-size:12px; color:#6b7280; margin-top:4px;">${meta}</div>` : ''}
            </div>
          `;
        }).join('');
      } catch (err) {
        box.innerHTML = '<div style="font-size:12.5px; color:#b91c1c;">Something went wrong loading this client\'s past customers.</div>';
      }
    });
  });
}

loadClients();
</script>
</body>
</html>
