<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Dispatch AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/">Dispatch<span>AI</span></a>
    <nav>
      <a href="/">Home</a>
      <a href="/onboard">New client</a>
    </nav>
  </header>

  <section style="padding: 40px 0;">
    <h1 style="font-size:28px;">Clients</h1>
    <p style="color:#4b5563;">Every business that's filled out the intake form, with their AI agent's draft script.</p>
    <div class="client-list" id="clientList"></div>
  </section>

  <footer>Dispatch AI — MVP prototype.</footer>
</div>

<script>
async function loadClients() {
  const res = await fetch('/api/clients');
  const clients = await res.json();
  const list = document.getElementById('clientList');
  list.innerHTML = '';

  if (clients.length === 0) {
    list.innerHTML = '<p style="color:#9ca3af;">No clients yet. <a href="/onboard">Add one</a>.</p>';
    return;
  }

  clients.slice().reverse().forEach((client) => {
    const card = document.createElement('div');
    card.className = 'client-card';

    const statusClass = client.status === 'paid' ? 'status-paid'
      : client.status === 'cancelled' ? 'status-cancelled'
      : client.status === 'approved' ? 'status-approved'
      : client.status === 'generating' ? 'status-generating'
      : 'status-draft';

    // The script itself was already reviewed once the client has ever
    // reached approved/paid/cancelled -- cancellation is a billing state,
    // not a reason to re-review the script.
    const scriptWasApproved = ['approved', 'paid', 'cancelled'].includes(client.status);

    const paymentLinkButtons = `
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-secondary checkout-btn" data-id="${client.id}" data-plan="starter">Get Starter link</button>
        <button class="btn btn-secondary checkout-btn" data-id="${client.id}" data-plan="growth">Get Growth link</button>
      </div>
      <div class="checkout-result" data-id="${client.id}" style="margin-top:10px; display:none;"></div>
    `;

    let billingHtml = '';
    if (client.status === 'paid') {
      const planLabel = client.plan === 'growth' ? 'Growth' : client.plan === 'starter' ? 'Starter' : 'plan unknown';
      billingHtml = `
        <div class="billing-box billing-paid">
          💳 Paid — ${planLabel}
        </div>
      `;
    } else if (client.status === 'cancelled') {
      billingHtml = `
        <div class="billing-box billing-cancelled">
          <div style="font-weight:600; margin-bottom:8px;">⚠️ Subscription cancelled${client.cancelledAt ? ' — ' + new Date(client.cancelledAt).toLocaleDateString() : ''}</div>
          <div style="font-size:12.5px; margin-bottom:10px;">This client's AI agent should be considered off until they resubscribe. If they're connected to a real phone number, pause or remove that agent in Retell too.</div>
          ${paymentLinkButtons}
        </div>
      `;
    } else if (client.status === 'approved') {
      billingHtml = `
        <div class="billing-box">
          <div style="font-size:13px; font-weight:600; margin-bottom:8px;">Send a payment link to go live</div>
          ${paymentLinkButtons}
        </div>
      `;
    }

    card.innerHTML = `
      <div class="top-row">
        <strong>${client.intake?.companyName || '(unnamed)'}</strong>
        <span class="status-pill ${statusClass}">${client.status}</span>
      </div>
      <div style="font-size:13px; color:#6b7280; margin-top:4px;">
        ${client.intake?.trades || ''} · ${client.intake?.serviceArea || ''}
      </div>
      <textarea class="script-box" data-id="${client.id}">${client.script || ''}</textarea>
      <div style="margin-top:10px; display:flex; gap:10px;">
        <button class="btn btn-secondary save-btn" data-id="${client.id}">Save edits</button>
        <button class="btn btn-primary approve-btn" data-id="${client.id}" ${scriptWasApproved ? 'disabled' : ''}>
          ${scriptWasApproved ? 'Approved ✓' : 'Approve script'}
        </button>
      </div>
      ${billingHtml}
    `;
    list.appendChild(card);
  });

  document.querySelectorAll('.save-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const textarea = document.querySelector(`.script-box[data-id="${id}"]`);
      btn.textContent = 'Saving...';
      await fetch(`/api/clients/${id}/script`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ script: textarea.value })
      });
      btn.textContent = 'Save edits';
    });
  });

  document.querySelectorAll('.approve-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      await fetch(`/api/clients/${id}/approve`, { method: 'POST' });
      loadClients();
    });
  });

  document.querySelectorAll('.checkout-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const plan = btn.dataset.plan;
      const resultBox = document.querySelector(`.checkout-result[data-id="${id}"]`);
      resultBox.style.display = 'block';
      resultBox.textContent = 'Generating link...';

      try {
        const res = await fetch(`/api/clients/${id}/checkout`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ plan })
        });
        const data = await res.json();

        if (data.demoMode) {
          resultBox.innerHTML = `<span style="color:#9a3412;">${data.message}</span>`;
        } else if (data.url) {
          resultBox.innerHTML = `
            <div style="font-size:12.5px; margin-bottom:4px;">Send this link to the client to complete payment:</div>
            <input type="text" readonly value="${data.url}" style="width:100%; padding:8px; border-radius:6px; border:1px solid #e5e7eb; font-size:12.5px;" onclick="this.select()" />
          `;
        } else {
          resultBox.innerHTML = `<span style="color:#b91c1c;">Something went wrong generating the link.</span>`;
        }
      } catch (err) {
        resultBox.innerHTML = `<span style="color:#b91c1c;">Something went wrong generating the link.</span>`;
      }
    });
  });
}

loadClients();
</script>
</body>
</html>
